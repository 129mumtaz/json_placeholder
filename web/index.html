<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clean modern website for exploring JSONPlaceholder API built with Flutter.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JSONPlaceholder API">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JSONPlaceholder API</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; padding: 0; background-color: #F7F8FA;">
  <!-- Loading indicator sebelum Flutter Web siap -->
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#F7F8FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div style="width:36px;height:36px;border:3px solid #E5E8ED;border-top:3px solid #526B9A;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="margin-top:16px;color:#737B89;font-size:13px;font-weight:500;letter-spacing:0.2px;">Memuat JSONPlaceholder API...</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
